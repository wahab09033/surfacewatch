# Tool configuration. Deliberately not a packaging manifest — this is an
# application, not a library, and there is nothing to build or publish. Only
# the linter is configured here.

[tool.ruff]
target-version = "py312"          # matches the Dockerfile's python:3.12-slim base
line-length = 100
exclude = [
    ".venv",
    # Alembic revision files are generated, then hand-edited once and never
    # again. Linting them means every autogenerated import is a finding.
    "db/migrations/versions",
]

[tool.ruff.lint]
# The rule set is chosen so that CI is a gate on defects rather than taste.
# Everything selected here flags something that is probably a bug; everything
# left out is a style preference that would have produced a hundred-line diff
# on the first run and taught everyone to ignore the linter.
#
#   E4, E7, E9  imports, statements, and errors that are wrong at runtime
#   F           pyflakes: undefined names, unused imports, shadowed things
#   B           bugbear: patterns that are correct-looking and usually wrong
select = ["E4", "E7", "E9", "F", "B"]

ignore = [
    # FastAPI's whole dependency-injection idiom is a call in an argument
    # default: `limit: int = Query(50, le=200)`. Flagging it would mean either
    # restructuring every route or a noqa on each, and neither is an
    # improvement. B008 exists to catch mutable-default bugs, which Query()
    # objects are not.
    "B008",
]
